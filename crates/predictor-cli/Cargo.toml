[package]
name = "predictor-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lp"
path = "src/main.rs"

[[bin]]
name = "lp-electron"
path = "src/electron.rs"

[dependencies]
predictor-core = { path = "../predictor-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unicode-segmentation = "=1.12.0"
bzip2 = "=0.6.1"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
libc = "=0.2.177"
quick-xml = "=0.38.3"

[dev-dependencies]
tempfile = "=3.23.0"
