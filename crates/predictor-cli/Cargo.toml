[package]
name = "predictor-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lp"
path = "src/main.rs"
required-features = ["tooling"]

[[bin]]
name = "lp-electron"
path = "src/electron.rs"

[features]
default = ["tooling"]
tooling = ["dep:sha2", "dep:unicode-segmentation", "dep:bzip2", "dep:rusqlite", "dep:libc", "dep:quick-xml"]

[dependencies]
predictor-core = { path = "../predictor-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }
bzip2 = { version = "=0.6.1", optional = true }
rusqlite = { version = "=0.38.0", features = ["bundled"], optional = true }
libc = { version = "=0.2.177", optional = true }
quick-xml = { version = "=0.38.3", optional = true }

[dev-dependencies]
tempfile = "=3.23.0"
