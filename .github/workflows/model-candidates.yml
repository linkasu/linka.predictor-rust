name: Manual Book model candidate import (not qualification)
on:
  workflow_dispatch:
    inputs:
      import_manifest:
        description: Tracked main-tree linka-book-candidate-import-v1 JSON path (no secrets)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: predictor-model-import
  cancel-in-progress: false
jobs:
  candidates:
    if: github.ref == 'refs/heads/main' && github.repository == 'linkasu/linka.predictor-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: linkasu/linka.looks-electron
          ref: main
          fetch-depth: 0
          path: .local/app-tooling
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
      - name: Validate tracked manifest before any Book download
        id: manifest
        env:
          IMPORT_MANIFEST: ${{ inputs.import_manifest }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const {readImportManifest} = require('./.local/app-tooling/scripts/ci/import-book-candidate.cjs');
          const {manifest: m} = readImportManifest(process.cwd(), process.env.IMPORT_MANIFEST, process.env.GITHUB_WORKFLOW_SHA);
          if (process.env.GITHUB_SHA !== process.env.GITHUB_WORKFLOW_SHA) throw new Error('main workflow tree required');
          execFileSync('git', ['merge-base', '--is-ancestor', process.env.GITHUB_WORKFLOW_SHA, 'origin/main']);
          execFileSync('git', ['merge-base', '--is-ancestor', m.model_source_sha, 'origin/main']);
          execFileSync('git', ['merge-base', '--is-ancestor', m.app_tooling_sha, 'origin/main'], {cwd: '.local/app-tooling'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `model_source_sha=${m.model_source_sha}\napp_tooling_sha=${m.app_tooling_sha}\n`);
          JS
      - name: Pin selected app main-history tooling
        env:
          APP_TOOLING_SHA: ${{ steps.manifest.outputs.app_tooling_sha }}
        run: git -C .local/app-tooling checkout --detach "$APP_TOOLING_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.manifest.outputs.model_source_sha }}
          fetch-depth: 0
          path: .local/model-source
          persist-credentials: false
      - name: Mask and isolate one-asset read capability (never a PAT)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BOOK_READ_CAPABILITY: ${{ secrets.LINKA_BOOK_CANDIDATE_READ_CAPABILITY }}
        with:
          script: |
            try {
              const raw = process.env.BOOK_READ_CAPABILITY;
              if (typeof raw !== 'string' || raw.length === 0) throw new Error('missing');
              core.setSecret(raw);
              if (Buffer.byteLength(raw, 'utf8') > 65000) throw new Error('oversized');
              const value = JSON.parse(raw);
              if (typeof value?.download_url === 'string') core.setSecret(value.download_url);
              if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main' ||
                  `${context.repo.owner}/${context.repo.repo}` !== 'linkasu/linka.predictor-rust') throw new Error('invalid');
              const file = require('node:path').join(process.env.RUNNER_TEMP, 'book-candidate-transport.json');
              require('node:fs').writeFileSync(file, raw, { flag: 'wx', mode: 0o600 });
              core.exportVariable('BOOK_TRANSPORT_FILE', file);
            } catch {
              core.setFailed('Book transport gate rejected input; no capability details logged.');
            }
      - name: Import verified Book outputs; no CI training, build or inference
        env:
          IMPORT_MANIFEST: ${{ inputs.import_manifest }}
        run: node .local/app-tooling/scripts/ci/import-book-candidate.cjs
      - name: Candidate artifacts, never a release; optional T failure retains U
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .local/model-400/bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Remove isolated operator capability
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const file = require('node:path').join(process.env.RUNNER_TEMP, 'book-candidate-transport.json');
            require('node:fs').rmSync(file, { force: true });
