name: Promote reviewed write-once base model (no training or rebuild)

on:
  workflow_dispatch:
    inputs:
      approval_path:
        description: Reviewed tracked provenance/releases/*.json on trusted main; never generated by this workflow
        required: true
        type: string
      source_sha:
        description: Exact reviewed model-candidate source SHA already in main history
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: immutable-base-ru-v1-promotion
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'linkasu/linka.predictor-rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      inventory_sha256: ${{ steps.seal.outputs.inventory_sha256 }}
      source_sha: ${{ steps.approval.outputs.source_sha }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: approval
      - name: Bound tracked approval and immutable source before selecting tooling
        id: approval
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          APPROVAL_PATH: ${{ inputs.approval_path }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const path = require('node:path');
            const {execFileSync} = require('node:child_process');
            assert.equal(context.eventName, 'workflow_dispatch');
            assert.equal(context.repo.owner+'/'+context.repo.repo, 'linkasu/linka.predictor-rust');
            assert.equal(context.ref, 'refs/heads/main');
            const root = path.resolve('approval'), file = process.env.APPROVAL_PATH;
            assert(/^provenance\/releases\/[a-zA-Z0-9_-]+\.json$/.test(file));
            assert(/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA));
            execFileSync('git', ['-C', root, 'ls-files', '--error-unmatch', '--', file]);
            execFileSync('git', ['-C', root, 'merge-base', '--is-ancestor', process.env.SOURCE_SHA, 'HEAD']);
            let current = root;
            for (const part of file.split('/')) { current = path.join(current, part); assert(!fs.lstatSync(current).isSymbolicLink()); }
            const stat = fs.lstatSync(current); assert(stat.isFile() && stat.size > 0 && stat.size <= 1024*1024);
            const a = JSON.parse(fs.readFileSync(current, 'utf8'));
            assert.equal(a.schema, 'linka-base-model-release-approval-v1');
            assert.equal(a.repository, 'linkasu/linka.predictor-rust');
            assert.equal(a.source_sha, process.env.SOURCE_SHA);
            assert.equal(a.tag, 'base-ru-v1');
            assert.equal(a.review?.status, 'APPROVED');
            assert(/^[a-f0-9]{40}$/.test(a.app_tooling_sha));
            core.setOutput('app_tooling_sha', a.app_tooling_sha);
            core.setOutput('source_sha', a.source_sha);
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: linkasu/linka.looks-electron
          ref: ${{ steps.approval.outputs.app_tooling_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: tooling
      - name: Require reviewed tooling in application main before executing any of it
        working-directory: tooling
        env:
          TOOLING_SHA: ${{ steps.approval.outputs.app_tooling_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          git merge-base --is-ancestor "$TOOLING_SHA" origin/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          path: model-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ec07b2cd49c1c2c684e6643f0dab75cf5895ebca
          persist-credentials: false
          path: runtime-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
      - name: Locked tooling only; no lifecycle scripts or candidate execution
        working-directory: tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic approval, archive and exact-byte negative controls
        working-directory: tooling
        env:
          BASE_MODEL_WORKFLOW: ../approval/.github/workflows/promote-base-model.yml
        run: node --test scripts/ci/promote-base-model.test.cjs
      - name: Verify all approved runs before downloading; prepare exact public allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node tooling/scripts/ci/promote-base-model.cjs \
            "$GITHUB_WORKSPACE/approval" "$APPROVAL_PATH" "$SOURCE_SHA" \
            "$GITHUB_WORKSPACE/model-source" "$GITHUB_WORKSPACE/runtime-source" \
            "$RUNNER_TEMP/base-model-publication"
      - name: Seal prepared inventory across the privilege boundary
        id: seal
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs'), crypto = require('node:crypto');
            const bytes = fs.readFileSync(process.env.RUNNER_TEMP+'/base-model-publication/publication.json');
            core.setOutput('inventory_sha256', crypto.createHash('sha256').update(bytes).digest('hex'));
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: bundle
        with:
          name: reviewed-base-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base-model-publication/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.repository == 'linkasu/linka.predictor-rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # Never check out or execute source/approval-selected code in this write-token job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: publication
          merge-multiple: true
      - name: Rehash sealed allowlist, refuse collisions, publish create-only non-latest release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INVENTORY_SHA256: ${{ needs.prepare.outputs.inventory_sha256 }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
            const digest = data => crypto.createHash('sha256').update(data).digest('hex');
            assert.equal(context.eventName, 'workflow_dispatch');
            assert.equal(context.repo.owner+'/'+context.repo.repo, 'linkasu/linka.predictor-rust');
            assert.equal(context.ref, 'refs/heads/main');
            assert(/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA));
            assert(/^[a-f0-9]{64}$/.test(process.env.INVENTORY_SHA256));
            const root = path.resolve('publication');
            assert(fs.lstatSync(root).isDirectory());
            const inventoryStat = fs.lstatSync(path.join(root, 'publication.json'));
            assert(inventoryStat.isFile() && inventoryStat.size > 0 && inventoryStat.size <= 1024**2);
            const inventoryBytes = fs.readFileSync(path.join(root, 'publication.json'));
            assert.equal(digest(inventoryBytes), process.env.INVENTORY_SHA256);
            const inventory = JSON.parse(inventoryBytes);
            assert.equal(inventory.schema, 'linka-base-model-publication-v1');
            assert.equal(inventory.repository, 'linkasu/linka.predictor-rust');
            assert.equal(inventory.tag, 'base-ru-v1');
            assert.equal(inventory.source_sha, process.env.SOURCE_SHA);
            const names = ['model.lpk','lp-electron.exe','LICENSE','MODEL_NOTICE.md','MODEL_SOURCE_NOTICES.txt','KenLM-LICENSE','quality.json','performance.json','model-source.tar','runtime-source.tar','provenance.json','REPRODUCTION.json'];
            // The read-only prepare job seals the exact descriptor from tracked release approval.
            if (inventory.model_build_inputs !== undefined) {
              const capsule = inventory.model_build_inputs;
              assert.deepEqual(Object.keys(capsule || {}).sort(), ['bytes','path','sha256']);
              assert(capsule && /^provenance\/releases\/[a-zA-Z0-9_./-]+\.zip$/.test(capsule.path));
              assert(capsule.path.split('/').every(part => part && part !== '.' && part !== '..'));
              assert(/^[a-f0-9]{64}$/.test(capsule.sha256));
              assert(Number.isSafeInteger(capsule.bytes) && capsule.bytes > 0 && capsule.bytes <= 32*1024**2);
              assert.deepEqual(inventory.files['MODEL_BUILD_INPUTS.zip'], {sha256:capsule.sha256, bytes:capsule.bytes});
              names.push('MODEL_BUILD_INPUTS.zip');
            }
            assert.deepEqual(Object.keys(inventory.files).sort(), [...names].sort());
            assert.deepEqual(fs.readdirSync(root).sort(), [...names,'publication.json'].sort());
            const files = new Map([['publication.json', inventoryBytes]]);
            let total = inventoryBytes.length;
            for (const name of names) {
              const stat = fs.lstatSync(path.join(root, name)), spec = inventory.files[name];
              const maximum = name === 'model.lpk' ? 128*1024**2 : name === 'lp-electron.exe' ? 16*1024**2 : name === 'MODEL_BUILD_INPUTS.zip' ? 32*1024**2 : name.endsWith('.tar') ? 64*1024**2 : 1024**2;
              assert(stat.isFile() && stat.size > 0 && stat.size <= maximum && stat.size === spec.bytes);
              assert(/^[a-f0-9]{64}$/.test(spec.sha256));
              const bytes = fs.readFileSync(path.join(root, name)); assert.equal(digest(bytes), spec.sha256);
              total += bytes.length; assert(total <= 300*1024**2); files.set(name, bytes);
            }
            const args = context.repo, tag = 'base-ru-v1';
            for (const operation of [() => github.rest.git.getRef({...args, ref:'tags/'+tag}), () => github.rest.repos.getReleaseByTag({...args, tag})]) {
              let absent = false;
              try { await operation(); } catch (error) { if (error.status !== 404) throw error; absent = true; }
              assert(absent, 'Refuse existing release or tag; never overwrite or resume');
            }
            const {data: repository} = await github.rest.repos.get(args);
            assert.equal(repository.private, false, 'Public anonymous downloads require a public repository');
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({...args, basehead:process.env.SOURCE_SHA+'...main'});
            assert(['ahead','identical'].includes(comparison.status), 'Reviewed source must remain in main history');
            // createRef is exclusive: a racing tag creator causes failure, never an overwrite.
            await github.rest.git.createRef({...args, ref:'refs/tags/'+tag, sha:process.env.SOURCE_SHA});
            const {data: release} = await github.rest.repos.createRelease({...args, tag_name:tag, target_commitish:process.env.SOURCE_SHA,
              name:'Russian base model v1 (simulation/Windows CI evidence only)', draft:true, prerelease:false, make_latest:'false',
              body:'Exact reviewed model/runtime bytes; no retraining or rebuild. Model data: CC0-1.0. Code: GPL-3.0-or-later. Original notices and corresponding source/build recipes included. Raw corpus, profiles and FINAL are NOT bundled. REPRODUCTION.json records any separately approved, hash-verified original-source snapshot or the remaining source-input requirement; completeness of all reproduction inputs is not claimed. Hardware and client OS: NOT_TESTED. Not an application updater channel.'});
            for (const [name, data] of files) await github.rest.repos.uploadReleaseAsset({...args, release_id:release.id, name, data, headers:{'content-type':'application/octet-stream','content-length':data.length}});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...args, release_id:release.id, per_page:100});
            assert.deepEqual(assets.map(a => a.name).sort(), [...files.keys()].sort());
            for (const asset of assets) { const bytes = files.get(asset.name); assert.equal(asset.size, bytes.length); assert.equal(asset.digest, 'sha256:'+digest(bytes)); }
            const {data: ref} = await github.rest.git.getRef({...args, ref:'tags/'+tag});
            assert.equal(ref.object.type, 'commit'); assert.equal(ref.object.sha, process.env.SOURCE_SHA);
            const {data: published} = await github.rest.repos.updateRelease({...args, release_id:release.id, draft:false, make_latest:'false'});
            assert.equal(published.draft, false);
            const receipt = {release_id:release.id, tag, source_sha:process.env.SOURCE_SHA,
              integrity:'create-only versioned bytes, collision refusal and reviewed SHA256 pins; no server-enforcement claim',
              server_enforced_immutable:typeof published.immutable === 'boolean' ? published.immutable : null};
            await core.summary.addHeading('Reviewed base model published').addRaw(published.html_url)
              .addRaw('\n```json\n'+JSON.stringify(receipt,null,2)+'\n```\nHardware/client OS NOT_TESTED; raw reproducibility input not bundled.').write();
